# CI — the enforced quality gate.
#
# Runs the SAME gate as the local pre-commit hook (`npm run check:all` = Biome + tsc + Vitest),
# so "green" means one thing whether it ran on your machine or here. A commit made with
# `--no-verify`, or by someone without the hook installed, is caught at the PR instead of slipping
# into main. `check:all` now includes `cdk synth`, so the only thing CI adds beyond it is
# coverage-threshold enforcement.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels an in-flight run — no point finishing stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches the local toolchain (TypeScript 7, tsx)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate (Biome + tsc + Vitest)
        run: npm run check:all

      - name: Coverage thresholds
        run: npm run coverage
